worker_processes auto;
pid /var/run/openresty/nginx.pid;

# The main-context error_log must be explicit: without it, the master
# falls back to the build-time default log path, which is read-only
# under the unit's ProtectSystem=strict and aborts first boot.
error_log /var/log/openresty/error.log warn;

# Environment variables exposed to Lua (env is only valid in the main
# context). These come from /etc/mattermost-ssl-auth.env via the systemd
# unit's EnvironmentFile.
env MATTERMOST_UPSTREAM;
env REDIS_URI;
env MATTERMOST_PROVISION_TOKEN;
env ALLOW_PROVISION;
env MM_DEFAULT_TEAM_ID;
env CERT_EMAIL_FIELD;
env CERT_NAME_FIELD;
env CERT_ADMIN_OU;
env USERNAME_FROM_EMAIL;

events {
    worker_connections 4096;
}

http {
    lua_package_path "/usr/local/openresty/nginx/lua/?.lua;;";

    # Mattermost-sensitive query params must not reach the access log.
    # Each map stages one filter: In: ?token=secret&...  Out: ?token=[FILTERED]&...
    map $request_uri $mmssl_uri_1 {
        default     $request_uri;
        ~(?i)^(?<start>.*)(?<param>[\?&]token)=[^&]*(?<rest>.*)$  "$start$param=[FILTERED]$rest";
    }

    map $mmssl_uri_1 $mmssl_uri_2 {
        default     $mmssl_uri_1;
        ~(?i)^(?<start>.*)(?<param>[\?&]code)=[^&]*(?<rest>.*)$   "$start$param=[FILTERED]$rest";
    }

    map $mmssl_uri_2 $mmssl_uri {
        default     $mmssl_uri_2;
        ~(?i)^(?<start>.*)(?<param>[\?&]invite_id)=[^&]*(?<rest>.*)$  "$start$param=[FILTERED]$rest";
    }

    # Audit log: which client certificate made each request.
    log_format mmssl '$remote_addr [$time_local] "$request_method $mmssl_uri $server_protocol" '
                     '$status $body_bytes_sent $request_time '
                     'cert="$ssl_client_verify" cert_fp="$ssl_client_fingerprint" '
                     'dn="$ssl_client_s_dn" "$http_user_agent"';

    access_log /var/log/openresty/access.log mmssl;

    upstream mattermost_backend {
        server 127.0.0.1:8065;
        keepalive 32;
    }

    server {
        listen 443 ssl;
        server_name mattermost.example.test;

        # Replace with your server certificate/key.
        ssl_certificate     /etc/ssl/private/mattermost.crt;
        ssl_certificate_key /etc/ssl/private/mattermost.key;

        # Client certificate authentication.
        ssl_client_certificate /etc/ssl/private/client-ca.crt;
        ssl_verify_client on;
        ssl_verify_depth 4;

        # TLS hardening. Modern default ciphers are kept (a pinned list
        # would risk breaking client-certificate handshakes).
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        server_tokens off;

        # Browser-facing security headers.
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # Mattermost supports large uploads; tune to your deployment.
        client_max_body_size 2g;

        # WebSocket endpoint. Authentication is injected during the
        # HTTP Upgrade request.
        location = /api/v4/websocket {
            access_by_lua_file /usr/local/openresty/nginx/lua/mattermost_location_default.lua;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Ssl on;

            # Mattermost websockets are long-lived; the default 60s
            # proxy timeouts would drop idle connections.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            proxy_pass http://mattermost_backend;
        }

        # Login flow: the Lua hook redirects unauthenticated requests
        # to Mattermost's login; a 302 fallback covers the case where
        # the hook lets the request through (e.g. already signed in).
        location = /login {
            access_by_lua_file /usr/local/openresty/nginx/lua/mattermost_location_login.lua;

            return 302 /;
        }

        location / {
            access_by_lua_file /usr/local/openresty/nginx/lua/mattermost_location_default.lua;

            # HTTP/1.1 with an empty Connection header is required for
            # the upstream keepalive pool to be used.
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Ssl on;

            proxy_pass http://mattermost_backend;
        }
    }
}
