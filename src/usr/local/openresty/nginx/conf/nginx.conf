user git git;
#user  nobody;
worker_processes  8;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
    worker_connections  10240;
}

http {
    log_format gitlab_access '$remote_addr - $remote_user [$time_local] "$request_method $filtered_request_uri $server_protocol" $status $body_bytes_sent "$filtered_http_referer" "$http_user_agent" $gzip_ratio';
    log_format gitlab_mattermost_access '$remote_addr - $remote_user [$time_local] "$request_method $filtered_request_uri $server_protocol" $status $body_bytes_sent "$filtered_http_referer" "$http_user_agent" $gzip_ratio';

    ##hide_server_tokens off;

    server_names_hash_bucket_size 64;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 65;
    keepalive_time 1h;

    gzip on;
    gzip_http_version 1.1;
    gzip_comp_level 2;
    gzip_proxied no-cache no-store private expired auth;
    gzip_types text/plain text/css application/x-javascript text/xml application/xml application/xml+rss text/javascript application/json;

    include       mime.types;
    default_type  application/octet-stream;

    proxy_cache_path proxy_cache keys_zone=gitlab:10m max_size=1g levels=1:2;
    proxy_cache gitlab;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Remove private_token from the request URI
    # In:  /foo?private_token=unfiltered&authenticity_token=unfiltered&rss_token=unfiltered&...
    # Out: /foo?private_token=[FILTERED]&authenticity_token=unfiltered&rss_token=unfiltered&...
    map $request_uri $temp_request_uri_1 {
        default $request_uri;
        ~(?i)^(?<start>.*)(?<temp>[\?&]private[\-_]token)=[^&]*(?<rest>.*)$ "$start$temp=[FILTERED]$rest";
    }

    # Remove authenticity_token from the request URI
    # In:  /foo?private_token=[FILTERED]&authenticity_token=unfiltered&rss_token=unfiltered&...
    # Out: /foo?private_token=[FILTERED]&authenticity_token=[FILTERED]&rss_token=unfiltered&...
    map $temp_request_uri_1 $temp_request_uri_2 {
        default $temp_request_uri_1;
        ~(?i)^(?<start>.*)(?<temp>[\?&]authenticity[\-_]token)=[^&]*(?<rest>.*)$ "$start$temp=[FILTERED]$rest";
    }

    # Remove rss_token from the request URI
    # In:  /foo?private_token=[FILTERED]&authenticity_token=[FILTERED]&rss_token=unfiltered&...
    # Out: /foo?private_token=[FILTERED]&authenticity_token=[FILTERED]&rss_token=[FILTERED]&...
    map $temp_request_uri_2 $filtered_request_uri {
        default $temp_request_uri_2;
        ~(?i)^(?<start>.*)(?<temp>[\?&]rss[\-_]token)=[^&]*(?<rest>.*)$ "$start$temp=[FILTERED]$rest";
    }

    # A version of the referer without the query string
    map $http_referer $filtered_http_referer {
        default $http_referer;
        ~^(?<temp>.*)\? $temp;
    }

    # Enable vts status module.
    ##vhost_traffic_status_zone;

    upstream gitlab-workhorse {
        server unix:/var/opt/gitlab/gitlab-workhorse/sockets/socket;
    }

    #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  logs/access.log;
    error_log   logs/error.log info;

    lua_package_path "/etc/nginx/lua/?.lua;;";
    server {
        listen 80;
        location / {
            proxy_pass http://gitlab-workhorse;
        }
    }

    server {
        listen 443 ssl;
        server_name _;
        ssl_certificate        /etc/ssl/private/gitlab.crt;
        ssl_certificate_key    /etc/ssl/private/gitlab.key;
        ssl_client_certificate /etc/ssl/private/ca.crt;
        ssl_verify_client on;
        ssl_protocols           TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers   on;

        server_tokens off;
        client_max_body_size 0;

        add_header Strict-Transport-Security "max-age=63072000";
        add_header Referrer-Policy strict-origin-when-cross-origin;

        access_log  /var/log/gitlab/nginx/gitlab_access.log gitlab_access;
        error_log   /var/log/gitlab/nginx/gitlab_error.log error;

        if ($http_host = "") {
            set $http_host_with_default "gitlab.example.com";
        }

        if ($http_host != "") {
            set $http_host_with_default $http_host;
        }

        gzip on;
        gzip_static on;
        gzip_comp_level 2;
        gzip_http_version 1.1;
        gzip_vary on;
        gzip_disable "msie6";
        gzip_min_length 250;
        gzip_proxied no-cache no-store private expired auth;
        gzip_types text/plain text/css application/x-javascript text/xml application/xml application/xml+rss text/javascript application/json;

        proxy_read_timeout      3600;
        proxy_connect_timeout   300;
        proxy_redirect          off;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host_with_default;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-Proto https;

        # Custom
        set $gitlab_workhorse "unix:/var/opt/gitlab/gitlab-workhorse/sockets/socket";
        set $gitlab_agent     "unix:/var/opt/gitlab/gitlab-rails/sockets/runner.socket";
        set $redis_uri        "unix:/var/opt/gitlab/redis/redis.socket";

        location ~ (/api/v\d/jobs/\d+/artifacts$|/import/gitlab_project$|\.git/git-receive-pack$|\.git/gitlab-lfs/objects|\.git/info/lfs/objects/batch$) {
            proxy_cache off;
            access_by_lua_file /usr/local/openresty/nginx/lua/gitlab_location_default.lua;
            proxy_pass http://gitlab-workhorse;
            proxy_request_buffering off;
        }

        location ~ ^/api/v\d {
            proxy_cache off;
            access_by_lua_file /usr/local/openresty/nginx/lua/gitlab_location_default.lua;
            proxy_intercept_errors off;
        }

        location = /-/kubernetes-agent/ {
            access_by_lua_file /usr/local/openresty/nginx/lua/gitlab_location_default.lua;
            proxy_pass http://localhost:8150/;
            proxy_intercept_errors off;
        }

        location /-/kubernetes-agent/k8s-proxy/ {
            access_by_lua_file /usr/local/openresty/nginx/lua/gitlab_location_default.lua;
            proxy_pass http://localhost:8154/;
            proxy_buffering off;
            proxy_intercept_errors off;
        }

        location /users/sign_in {
            default_type text/html;
            proxy_cache off;
            access_by_lua_file /usr/local/openresty/nginx/lua/gitlab_location_sign_in.lua;
            proxy_pass http://gitlab-workhorse;
            proxy_redirect http:// https://;
        }

        location / {
            default_type text/html;
            proxy_cache off;
            access_by_lua_file /usr/local/openresty/nginx/lua/gitlab_location_default.lua;
            proxy_pass http://gitlab-workhorse;
            proxy_redirect http:// https://;
        }

        location /assets {
            add_header X-Content-Type-Options nosniff;
            proxy_cache gitlab;
            proxy_pass  http://gitlab-workhorse;
        }

        error_page 404 /404.html;
        error_page 500 /500.html;
        error_page 502 /502.html;
        location ~ ^/(404|500|502)(-custom)?\.html$ {
            root /opt/gitlab/embedded/service/gitlab-rails/public;
            internal;
        }

    }

}
