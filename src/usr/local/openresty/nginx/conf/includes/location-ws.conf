        location = /api/v4/websocket {
            access_by_lua_file /usr/local/openresty/nginx/lua/mattermost_location_default.lua;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            # Origin normalization for WS: see mattermost_location_default.lua (same-host only)
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Ssl on;

            # Mattermost websockets are long-lived; the default 60s
            # proxy timeouts would drop idle connections.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            proxy_pass http://mattermost_backend;
        }
