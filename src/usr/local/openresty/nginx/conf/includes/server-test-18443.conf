    # LOCAL TEST INGRESS (development only) — bound to loopback; emulates the
    # reverse proxy's client-certificate unpacking via the X-Test-DN header.
    # The production 443 server pins $mmssl_test_dn to empty (seam disabled).
    server {
        listen 127.0.0.1:18443;
        server_name mattermost.example.test;

        set $mmssl_test_dn $http_x_test_dn;

        client_max_body_size 2g;

        # WebSocket endpoint. Authentication is injected during the
        # HTTP Upgrade request.
        location = /api/v4/websocket {
            access_by_lua_file /usr/local/openresty/nginx/lua/mattermost_location_default.lua;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            # Origin normalization for WS: see mattermost_location_default.lua (same-host only)
            proxy_set_header Host $host;
            include /usr/local/openresty/nginx/conf/includes/proxy-common-headers.conf;

            # Mattermost websockets are long-lived; the default 60s
            # proxy timeouts would drop idle connections.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            proxy_pass http://mattermost_backend;
        }

        # Login flow: the Lua hook renews the cached session and always
        # terminates the request itself (302 on success, error on failure).
        # Do not add "return" here: it runs in the rewrite phase, which
        # precedes the access phase, and would preempt the hook entirely.
        location = /login {
            access_by_lua_file /usr/local/openresty/nginx/lua/mattermost_location_login.lua;
        }

        location / {
            access_by_lua_file /usr/local/openresty/nginx/lua/mattermost_location_default.lua;
            # Hydrates the browser cookie jar with the stored session
            # (pure-Lua, no cosockets — ADR 0002).
            header_filter_by_lua_file /usr/local/openresty/nginx/lua/mattermost_cookie_hydration.lua;

            # HTTP/1.1 with an empty Connection header is required for
            # the upstream keepalive pool to be used.
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            include /usr/local/openresty/nginx/conf/includes/proxy-common-headers.conf;

            proxy_pass http://mattermost_backend;
        }
    }
