# Proxy headers shared by every proxied location (spliced in via
# include). They cannot live in the http block instead: nginx
# proxy_set_header inheritance is all-or-nothing — a location
# that defines any proxy_set_header inherits none of the outer
# ones, so an http-level block would silently drop these from
# every location. Order among proxy_set_header directives is
# functionally irrelevant.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Ssl on;
