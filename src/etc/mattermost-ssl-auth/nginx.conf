worker_processes auto;
pid /var/run/openresty/nginx.pid;

# The main-context error_log must be explicit: without it, the master
# falls back to the build-time default log path, which is read-only
# under the unit's ProtectSystem=strict and aborts first boot.
error_log /var/log/openresty/error.log warn;

# Environment variables exposed to Lua (env is only valid in the main
# context). These come from /etc/mattermost-ssl-auth.env via the systemd
# unit's EnvironmentFile.
env MATTERMOST_UPSTREAM;
env MATTERMOST_SITE_URL;
env REDIS_URI;
env MATTERMOST_PROVISION_TOKEN;
env ALLOW_PROVISION;
env MM_DEFAULT_TEAM_ID;
env CERT_EMAIL_FIELD;
env CERT_NAME_FIELD;
env CERT_ADMIN_OU;
env USERNAME_FROM_EMAIL;
env SESSION_MAX_AGE_HOURS;
env SESSION_CHECK_INTERVAL_SECONDS;

events {
    worker_connections 4096;
}

http {
    lua_package_path "/usr/local/openresty/nginx/lua/?.lua;;";

    # Per-user session-health check throttle (the access-phase
    # health_check re-establishes a 401 or over-age session).
    lua_shared_dict mmssl_sessions 1m;

    # Temp files live under a dedicated, package-independent tree. The
    # compile-time defaults sit under the nginx prefix, where the package
    # creates them — but ProtectSystem=strict mounts that prefix read-only,
    # so on a fresh install nginx can neither create the hash subdirs nor
    # let the workers write (502s on proxied responses). The unit creates
    # and opens this tree (StateDirectory + ReadWritePaths); the installer
    # creates it and chowns it to the worker user (see
    # example/demo_install.sh).
    client_body_temp_path /var/lib/openresty/client_body_temp;
    fastcgi_temp_path   /var/lib/openresty/fastcgi_temp;
    proxy_temp_path     /var/lib/openresty/proxy_temp;
    scgi_temp_path      /var/lib/openresty/scgi_temp;
    uwsgi_temp_path     /var/lib/openresty/uwsgi_temp;

    # Mattermost-sensitive query params must not reach the access log.
    # Each map stages one filter: In: ?token=secret&...  Out: ?token=[FILTERED]&...
    map $request_uri $mmssl_uri_1 {
        default     $request_uri;
        ~(?i)^(?<start>.*)(?<param>[\?&]token)=[^&]*(?<rest>.*)$  "$start$param=[FILTERED]$rest";
    }

    map $mmssl_uri_1 $mmssl_uri_2 {
        default     $mmssl_uri_1;
        ~(?i)^(?<start>.*)(?<param>[\?&]code)=[^&]*(?<rest>.*)$   "$start$param=[FILTERED]$rest";
    }

    map $mmssl_uri_2 $mmssl_uri {
        default     $mmssl_uri_2;
        ~(?i)^(?<start>.*)(?<param>[\?&]invite_id)=[^&]*(?<rest>.*)$  "$start$param=[FILTERED]$rest";
    }

    # Audit log: which client certificate made each request.
    log_format mmssl '$remote_addr [$time_local] "$request_method $mmssl_uri $server_protocol" '
                     '$status $body_bytes_sent $request_time '
                     'cert="$ssl_client_verify" cert_fp="$ssl_client_fingerprint" '
                     'dn="$ssl_client_s_dn" "$http_user_agent"';

    access_log /var/log/openresty/access.log mmssl;

    upstream mattermost_backend {
        server 127.0.0.1:8065;
        keepalive 32;
    }

    # Conf tree: each server block lives in
    # /etc/mattermost-ssl-auth/includes/ and is self-contained (its
    # location bodies are inline; the only shared snippet is
    # proxy-common-headers.conf, spliced into the WS and root
    # locations). Absolute paths — relative includes resolve against
    # the nginx prefix, not the conf directory.
    #
    # The whole tree is dpkg-owned: on a .deb install every file under
    # /etc/mattermost-ssl-auth/ is a conffile, so local edits are
    # preserved on upgrade and kept on `dpkg -r` (removed only by
    # `dpkg --purge`).
    #
    # The glob expands in alphabetical order. Current set:
    # server-443 (the only packaged server); optionally
    # server-test-18443.conf — the loopback test seam, an opt-in
    # template in example/ (not packaged; copy it into includes/ to
    # enable); plus, on the reference VM, the VM-only demo servers
    # 18444/18445, already on disk. A site-specific server is added
    # by dropping a server-*.conf file into
    # /etc/mattermost-ssl-auth/includes/ — the glob picks it up on
    # reload, and since the .deb does not ship it (only
    # server-443.conf is packaged), it survives .deb upgrades
    # untouched.
    include /etc/mattermost-ssl-auth/includes/server-*.conf;
}
